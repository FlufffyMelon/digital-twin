[project]
name = "digital-twin"
version = "1.0.0"
description = "Fine-tune an LLM on your Telegram chat so it writes like you"
requires-python = ">=3.12,<3.13"
dependencies = [
    # unsloth sets the upper bounds of torch / transformers / trl / datasets.
    "unsloth>=2026.11.3",
    "unsloth-zoo>=2026.11.3",
    "torch==2.14.*",
    "torchvision==0.29.*",
    "xformers==0.0.35",
    "bitsandbytes>=0.50.2",
    "transformers",
    "trl",
    "peft",
    "accelerate",
    "datasets",
    "huggingface-hub",
    "hf-transfer",
    "wandb",
]

[tool.uv]
package = false
# Linux + NVIDIA GPU only: there are no CUDA wheels for macOS.
environments = ["sys_platform == 'linux' and platform_machine == 'x86_64'"]

[tool.uv.sources]
torch = { index = "pytorch-cu130" }
torchvision = { index = "pytorch-cu130" }
xformers = { index = "pytorch-cu130" }

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true
