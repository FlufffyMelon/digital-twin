# ~/Dev/DigitalTwin/mutagen.yml
# Запуск:  cd ~/Dev/DigitalTwin && mutagen project start
# Стоп:    cd ~/Dev/DigitalTwin && mutagen project terminate
# Статус:  mutagen sync list digitaltwin
#
# Код живёт локально, обучение — на mipt. Синхронизируется только лёгкое:
# код, ноутбуки и json с переписками/датасетами. Веса, чекпоинты и логи
# экспериментов остаются на кластере.

sync:
  "digitaltwin":
    alpha: "."
    beta: "mipt:/home/CCP/semenchuk.aa/DigitalTwin"
    mode: "two-way-safe"
    permissions:
      # В json лежит личная переписка, а кластер общий: на mipt файлы
      # доступны только владельцу (домашний каталог и так 700, это вторая линия).
      defaultFileMode: 0600
      defaultDirectoryMode: 0700
    ignore:
      vcs: true            # .git не синхронизируем, git-операции только локально
      paths:
        # ── Результаты обучения: только на кластере ───────────────
        # На softcluster outputs/ занимал 8 ГБ (LoRA-адаптеры + optimizer state).
        - "outputs/"
        - "checkpoint-*/"
        - "wandb/"

        # ── Веса и тяжёлые бинарники ─────────────────────────────
        # Вторая линия защиты: если модель сохранится не в outputs/,
        # она всё равно не уедет на ноутбук.
        - "*.safetensors"
        - "*.bin"
        - "*.pt"
        - "*.pth"
        - "*.ckpt"
        - "*.gguf"
        - "*.arrow"         # кэш datasets

        # ── Кэши библиотек ────────────────────────────────────────
        - "unsloth_compiled_cache/"
        - "huggingface_tokenizers_cache/"
        - ".cache/"

        # ── Python окружение ──────────────────────────────────────
        # Локальный .venv собран под macOS, на кластере он бесполезен.
        - ".venv/"
        - "**/__pycache__/"
        - "*.pyc"
        - "*.so"

        # ── Jupyter мусор ─────────────────────────────────────────
        - "**/.ipynb_checkpoints/"

        # ── Состояние Claude Code ─────────────────────────────────
        - ".claude/"

        # ── Системные файлы ───────────────────────────────────────
        - ".nfs*"
        - ".DS_Store"
        - "mutagen.yml.lock"

        # ── Архивы ────────────────────────────────────────────────
        - "*.zip"
        - "*.tar.gz"

        # ── Логи slurm ────────────────────────────────────────────
        # Синхронизируются, чтобы читать вывод задач локально (~1 МБ на
        # прогон). Растущий лог гоняется по сети при каждом изменении;
        # если мешает — раскомментировать.
        # - "slurm*.out"
